[project]
name = "hkn"
version = "0.1.0"
description = "Healthcare Knowledge Navigator: cited, confidence-scored RAG over clinical guidelines and papers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.13",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pysbd>=0.3.4",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "torch>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

# CPU-only torch on Linux (CI and containers); macOS wheels from PyPI include MPS.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
hkn = "hkn.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hkn"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # E501: the formatter owns line length; RUF00x: clinical text has –, ≥, µ

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the docker Postgres from docker-compose.yml (make db-up)",
    "models: downloads and runs local sentence-transformers models",
]
addopts = "-m 'not integration and not models'"

[tool.pyright]
include = ["src", "evals"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.ruff.lint.isort]
known-first-party = ["hkn", "evals"]
