# Seed corpus: clinical guidelines, protocols and drug labels from US-government sources.
#
# Raw files are fetched into data/raw/ (gitignored) by `make ingest-seed`; nothing here
# is redistributed. Every entry records its license so the source panel can show it.
#
#   CDC MMWR        "All material in the MMWR Series is in the public domain and may be
#                    used and reprinted without permission; citation as to source,
#                    however, is appreciated."
#   NCI (cancer.gov) Text is free of copyright; credit the National Cancer Institute. The
#                    PDQ® trademark may only be used for wholly unchanged reproductions, so
#                    excerpts are titled without it and attributed to NCI.
#   USPSTF (AHRQ)   May be reproduced unchanged and non-commercially; cite the USPSTF web
#                    page as the source. We only quote verbatim sentences, with citations.
#   DailyMed (NLM)  FDA-approved labeling, US-government public information.
#
# parser.kind: html | spl | jats.  For html, `root` is the CSS selector of the content
# container; `start_heading` / `stop_headings` / `skip_headings` are case-insensitive
# regexes on heading text. `skip_headings` skips a section and its subsections.

defaults:
  user_agent: "Mozilla/5.0 (hkn-research-bot; educational RAG project)"

documents:
  # ---------------------------------------------------------------- infectious disease
  - source_key: cdc-sti-2021
    title: "Sexually Transmitted Infections Treatment Guidelines, 2021"
    org: CDC
    doc_type: guideline
    specialty: [infectious_disease]
    pub_year: 2021
    version: "MMWR Recomm Rep 2021;70(No. RR-4)"
    url: https://www.cdc.gov/mmwr/volumes/70/rr/rr7004a1.htm
    license: "Public domain (CDC MMWR)"
    parser:
      kind: html
      root: main
      start_heading: "^(Introduction|Background)$"
      stop_headings: ["^References$"]
      skip_headings: ["Work ?Group", "Disclosure of Relationship", "Conflicts? of Interest", "^Acknowledg", "^Contributors$"]
      strip_numeric_italics: true

