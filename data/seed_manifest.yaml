# PMC Open Access topics for `make ingest-pmc` (CC BY / CC0 only; same specialties so
# guideline and literature evidence overlap).
pmc_topics:
  - specialty: infectious_disease
    query: '(gonorrhea[tiab] OR chlamydia[tiab] OR syphilis[tiab] OR "doxycycline postexposure prophylaxis"[tiab]) AND (treatment[tiab] OR prophylaxis[tiab])'
  - specialty: hepatology
    query: '("hepatitis B"[tiab] OR "hepatitis C"[tiab]) AND (screening[tiab] OR testing[tiab])'
  - specialty: pain_management
    query: '(opioid[tiab] AND (prescribing[tiab] OR tapering[tiab] OR "chronic pain"[tiab])) OR buprenorphine[tiab]'
  - specialty: oncology
    query: '("breast cancer"[tiab] OR "colorectal cancer"[tiab] OR "colon cancer"[tiab]) AND (screening[tiab] OR "adjuvant"[tiab])'
